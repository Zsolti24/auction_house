packages:
  - "packages/*"

# Packages allowed to run install scripts (pnpm blocks them by default).
# better-sqlite3 needs its native binary; esbuild is used by Vite and tsx.
allowBuilds: # pnpm >= 11
  esbuild: true
  better-sqlite3: true
onlyBuiltDependencies: # pnpm 10
  - esbuild
  - better-sqlite3
